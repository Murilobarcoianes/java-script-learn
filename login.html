<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>
<body class="body">
    <form action="" method="post" class="box" id="loginBox">
        <label for="fnome">Entrar:</label>
        <input 
            type="text"
            id="Bnome"
            name="fnome"
            placeholder="Digite seu nome"
            required
        >

        <input
            type="password"
            id="Bsenha"
            name="fsenha"
            placeholder="Digite sua senha"
            required
        >

        <button type="button" onclick="Login()">Entrar</button>
    </form>

    <script>
        function Login() {
            const senha = document.getElementById('Bsenha').value;
            const nome = document.getElementById('Bnome').value;
            const box = document.getElementById('loginBox');

            if (nome === 'timeless' && senha === '45564') {
                document.body.classList.add('success');
                box.classList.add('success');
                box.classList.remove('error');

                setTimeout(() => {
                    window.location.href = 'indexv2.html';
                }, 800);
            } else {
                document.body.classList.remove('success');
                box.classList.remove('success');
                box.classList.add('error');
            }
        }
    </script>
</body>
</html>
